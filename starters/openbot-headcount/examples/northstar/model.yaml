# The same model block the shipped example package uses. `credential_secret_ref` names a stored
# credential, never a key: with nothing stored under that name, the server reads OPENAI_API_KEY from
# the environment. For Anthropic, set `provider: anthropic`, a Claude model id as `default_model`,
# and ANTHROPIC_API_KEY.
model:
  provider: openai
  credential_secret_ref: openai-api-key
  default_model: gpt-5.6-terra

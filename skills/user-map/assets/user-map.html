<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>User map</title>
<!--
  /user-map template. Do not hand-edit the markup below: fill the JSON in the
  <script id="user-map-data"> block (schema: skills/user-map/references/map-schema.md)
  and build it with:  node skills/user-map/scripts/build-map.mjs docs/copilot/user-map.json
  One self-contained file: inline CSS and JS, no network calls, no external fonts.
-->
<style>
:root {
  --paper: #f6f5f1; --surface: #ffffff; --stone: #edebe6; --stone-deep: #e1ded6;
  --ink: #141310; --ink-soft: #2d2b27; --muted: #65615a; --hairline: #e2dfd8; --rule: #cbc7be;
  --on-ink: #ffffff;
  --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 8px; --r-sm: 5px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121110; --surface: #1b1a18; --stone: #252421; --stone-deep: #2f2d29;
    --ink: #f0efe9; --ink-soft: #d9d7cf; --muted: #a9a59c; --hairline: #2f2d29; --rule: #45423c;
    --on-ink: #121110;
  }
}
:root[data-theme="dark"] {
  --paper: #121110; --surface: #1b1a18; --stone: #252421; --stone-deep: #2f2d29;
  --ink: #f0efe9; --ink-soft: #d9d7cf; --muted: #a9a59c; --hairline: #2f2d29; --rule: #45423c;
  --on-ink: #121110;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 14.5px/1.55 var(--sans); font-variant-numeric: tabular-nums;
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }
@media (min-width: 720px) { .wrap { padding: 0 32px 80px; } }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--hairline); }
.bar .tag { font: 600 12px/1 var(--mono); letter-spacing: .02em; }
.bar .tools { display: flex; gap: 6px; }
.btn { font: 500 12.5px/1 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 7px 10px; cursor: pointer; }
.btn:hover { background: var(--stone); }
.btn:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* where this sits: the functional-copilot root, then the numbered steps */
.sroot { font: 600 11.5px/1 var(--mono); letter-spacing: .05em; color: var(--muted); }
ol.suite5 { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; font-size: 12.5px; }
ol.suite5 li { display: flex; align-items: center; gap: 4px; }
ol.suite5 li + li::before { content: "→"; color: var(--muted); padding: 0 2px; }
.st { border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; color: var(--ink-soft); white-space: nowrap; }
.st b { font: 600 11.5px/1 var(--mono); margin-right: 4px; }
.st.now { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 600; }
.st.learn { border-style: dashed; color: var(--muted); }

/* the calm top: one headline, then role → software → copilot */
header.top { padding: 34px 0 30px; display: flex; flex-direction: column; justify-content: center; }
@media (min-width: 760px) and (min-height: 620px) { header.top { min-height: calc(100vh - 58px); padding: 32px 0 36px; } }
header.top h1 { font: 500 clamp(32px, 5.4vw, 58px)/1.08 var(--serif); letter-spacing: -.015em; margin: clamp(28px, 7vh, 64px) 0 clamp(24px, 6vh, 52px); max-width: 20ch; }
ol.rpath { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
@media (min-width: 760px) { ol.rpath { flex-direction: row; gap: 0; } }
ol.rpath .pc { flex: 1 1 0; min-width: 0; }
ol.rpath .arr { align-self: center; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 0; }
@media (min-width: 760px) { ol.rpath .arr { padding: 0 12px; } }
@media (max-width: 759px) { ol.rpath .arr { transform: rotate(90deg); } }
.pc a { display: flex; flex-direction: column; gap: 7px; height: 100%; text-decoration: none; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r); padding: 18px 20px 20px; }
.pc a:hover { border-color: var(--rule); }
.pc .pk { font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pc .pt { font: 500 clamp(19px, 2.2vw, 24px)/1.2 var(--serif); }
.pc .ps { font-size: 14px; line-height: 1.45; color: var(--muted); }
.pc.cp a { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.pc.cp .pk, .pc.cp .ps { color: var(--on-ink); opacity: .8; }
.scrollhint { margin: 26px 0 0; font-size: 13px; }
.scrollhint a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
#glance { border-top: 1px solid var(--hairline); padding-top: 28px; }
#glance h2 { font: 500 20px/1.25 var(--serif); margin: 0 0 8px; }
.oneline { font: 400 clamp(16px, 2.2vw, 19px)/1.45 var(--serif); color: var(--ink-soft); max-width: 62ch; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); border-radius: var(--r); overflow: hidden; margin: 20px 0 0; }
.meta div { background: var(--surface); padding: 10px 12px; flex: 1 1 150px; min-width: 0; }
.meta div.wide { flex: 2 1 300px; }
.meta dt { font-size: 11.5px; color: var(--muted); margin: 0 0 2px; }
.meta dd { margin: 0; font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 14px 0 0; font-size: 12.5px; color: var(--muted); }

/* map path (role → … → placement) */
nav.path { margin: 22px 0 6px; }
nav.path ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 0; }
nav.path li { display: flex; align-items: center; font-size: 13px; }
nav.path li + li::before { content: "→"; color: var(--muted); padding: 0 8px; }
nav.path a { text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 1px; }
nav.path a:hover { border-color: var(--ink); }
nav.path .n { font: 600 11px/1 var(--mono); color: var(--muted); margin-right: 5px; }

/* sections */
section.s { padding: 34px 0 6px; border-top: 1px solid var(--hairline); margin-top: 26px; }
.shead { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline; margin-bottom: 16px; }
.shead .num { font: 600 12px/1 var(--mono); color: var(--muted); }
.shead h2 { font: 500 clamp(21px, 3vw, 26px)/1.2 var(--serif); margin: 0; letter-spacing: -.005em; }
.shead p { grid-column: 2; margin: 0; color: var(--muted); font-size: 13.5px; }
h3 { font: 600 14px/1.3 var(--sans); margin: 0 0 6px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r); padding: 14px 16px; }
.card.assumed { border-style: dashed; border-color: var(--rule); }
.grid2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
ul.plain { list-style: none; padding: 0; margin: 0; }
ul.plain > li { padding: 8px 0; border-top: 1px solid var(--hairline); }
ul.plain > li:first-child { border-top: 0; padding-top: 0; }

/* evidence chips: status by fill, outline and weight */
.ev { display: inline-flex; align-items: center; gap: 3px; font: 500 11px/1 var(--sans); border-radius: 999px; padding: 3px 7px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; text-decoration: none; }
.ev.sourced { border: 1px solid var(--ink); color: var(--ink); }
.ev.assumed { border: 1px dashed var(--muted); color: var(--muted); font-style: italic; }
.ev.confirmed { background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink); font-weight: 700; }
.legend .ev { margin-left: 0; }

/* role */
.day { display: grid; gap: 8px; }
.dayrow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 38px; gap: 10px; align-items: center; font-size: 13.5px; }
.track { height: 8px; background: var(--stone); border-radius: 999px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.track.assumed i { background: repeating-linear-gradient(90deg, var(--ink) 0 4px, transparent 4px 7px); }
@media (min-width: 560px) { .dayrow { grid-template-columns: minmax(0, 1fr) 160px 38px; } }
.pct { text-align: right; font: 500 12.5px/1 var(--mono); }

/* wireframe */
.wire { display: grid; gap: 6px; padding: 6px; border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--surface); min-height: 240px; }
@media (min-width: 760px) { .wire { min-height: 300px; } }
.wire .rg { background: var(--stone); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 8px; min-width: 0; display: flex; flex-direction: column; gap: 3px; overflow: hidden; position: relative; }
.wire .rg b { font: 600 12px/1.25 var(--sans); overflow-wrap: break-word; hyphens: manual; }
.wire .rg .hd { font-size: 11.5px; color: var(--muted); line-height: 1.35; overflow-wrap: break-word; hyphens: manual; }
@media (max-width: 560px) { .wire .rg .hd { display: none; } .wire { min-height: 200px; } .wire .rg { padding: 6px; } .wire .rg b { font-size: 11px; } }
.wire .rg.cp { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.wire .rg.cp .hd { color: var(--on-ink); opacity: .82; }
.wire .rg.also { border: 2px solid var(--ink); background: var(--surface); }
.wire .rg .badge { align-self: flex-start; white-space: nowrap; font: 700 10px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 3px 6px; margin-bottom: 2px; }
.wire .rg.cp .badge { background: var(--on-ink); color: var(--ink); }
.wire .rg.also .badge { border: 1px solid var(--ink); }
.wire .rg.new { background: transparent; border: 1px dashed var(--rule); }
.wire .rg.new .badge { border: 1px dashed var(--muted); color: var(--muted); font-weight: 600; }
.newtag { font: 600 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .04em; border: 1px dashed var(--muted); border-radius: 999px; padding: 3px 6px; margin-left: 6px; color: var(--muted); vertical-align: 1px; }
.wirecap { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }

table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r); overflow: hidden; }
table.t th { text-align: left; font: 600 12px/1.3 var(--sans); color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--hairline); background: var(--paper); }
table.t td { padding: 10px 12px; border-top: 1px solid var(--hairline); vertical-align: top; }
table.t tr.assumed td { border-top-style: dashed; }
@media (max-width: 640px) {
  table.t thead { display: none; }
  table.t, table.t tbody, table.t tr, table.t td { display: block; width: 100%; }
  table.t tr { border-top: 1px solid var(--hairline); padding: 6px 0; }
  table.t td { border: 0; padding: 4px 12px; }
  table.t td[data-l]::before { content: attr(data-l); display: block; font-size: 11.5px; color: var(--muted); }
}

/* jobs */
.job { display: flex; flex-direction: column; gap: 8px; }
.job .jid { font: 600 11.5px/1 var(--mono); color: var(--muted); }
.job .stmt { font: 400 15.5px/1.45 var(--serif); }
.job .stmt em { font-style: normal; font-weight: 600; }
.job dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; }
.job dt { color: var(--muted); }
.job dd { margin: 0; }
.job.first { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.job.first .jid, .job.first dt { color: var(--on-ink); opacity: .75; }
.job.first .ev.sourced { border-color: var(--on-ink); color: var(--on-ink); }
.job.first .ev.assumed { border-color: var(--on-ink); color: var(--on-ink); opacity: .8; }
.job.first .ev.confirmed { background: var(--on-ink); color: var(--ink); }
.starthere { align-self: flex-start; font: 700 10.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; background: var(--on-ink); color: var(--ink); border-radius: 999px; padding: 4px 7px; }

/* flows */
.flow { margin: 0 0 22px; }
.flowhead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin: 0 0 10px; }
.flowhead h3 { font: 500 18px/1.3 var(--serif); margin: 0; }
.flowhead .io { font-size: 13px; color: var(--muted); }
ol.steps { list-style: none; margin: 0; padding: 0; border: 1px solid var(--hairline); border-radius: var(--r); background: var(--surface); counter-reset: st; }
ol.steps > li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; padding: 11px 14px; border-top: 1px solid var(--hairline); counter-increment: st; }
ol.steps > li:first-child { border-top: 0; }
ol.steps > li.assumed { border-top-style: dashed; }
ol.steps > li::before { content: counter(st); font: 600 12px/22px var(--mono); color: var(--muted); }
.stepbody { display: grid; gap: 4px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .stepbody { grid-template-columns: minmax(0, 1fr) 190px 110px; align-items: start; gap: 4px 16px; } }
.who { font-weight: 600; }
.where { font-size: 12.5px; color: var(--muted); }
.timecol { font-size: 12.5px; }
.timecol .track { margin-top: 5px; height: 6px; }
.kind { justify-self: start; font: 600 11px/1 var(--sans); border-radius: 999px; padding: 4px 8px; white-space: nowrap; }
@media (min-width: 760px) { .kind { justify-self: end; } }
.kind.approval { background: var(--ink); color: var(--on-ink); }
.kind.handoff { border: 1.5px solid var(--ink); }
.kind.wait { border: 1px dashed var(--muted); color: var(--muted); }
.kind.work { color: var(--muted); padding-left: 0; padding-right: 0; }
.timegoes { margin: 10px 0 0; padding: 10px 14px; border-left: 3px solid var(--ink); background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 13.5px; }

/* placement */
.prow { display: grid; grid-template-columns: 1fr; gap: 8px 22px; padding: 16px 0; border-top: 1px solid var(--hairline); }
@media (min-width: 760px) { .prow { grid-template-columns: 240px minmax(0, 1fr); } }
.prow h3 { font: 500 17px/1.25 var(--serif); margin: 0 0 3px; }
.prow .q { font-size: 12.5px; color: var(--muted); margin: 0 0 7px; }
.piece { display: inline-block; font: 600 12px/1.35 var(--mono); border: 1px solid var(--ink); border-radius: var(--r-sm); padding: 3px 7px; text-decoration: none; }
.piece:hover { background: var(--stone); }
.pitems { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pitems li { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-sm); padding: 9px 12px; }
.pitems li.assumed { border-style: dashed; border-color: var(--rule); }
.pitems .tname { font: 600 12.5px/1.3 var(--mono); display: block; margin-bottom: 2px; }
.pitems .det { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.notthis { margin: 10px 0 0; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: var(--r-sm); font-size: 13.5px; }
.notthis b { font-weight: 700; }

/* checklist */
.progress { font: 600 12.5px/1 var(--mono); color: var(--muted); }
ol.check { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ol.check > li { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; }
ol.check > li.done { background: var(--stone); }
ol.check > li.done .what { text-decoration: line-through; text-decoration-thickness: 1px; }
.check input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ink); cursor: pointer; }
.what { font-weight: 600; font-size: 14.5px; cursor: pointer; }
.cid { font: 600 11.5px/1 var(--mono); color: var(--muted); margin-right: 6px; }
.ck { display: grid; grid-template-columns: 1fr; gap: 3px 12px; margin-top: 6px; font-size: 13.5px; }
@media (min-width: 640px) { .ck { grid-template-columns: 82px minmax(0, 1fr); } }
.ck dt { font-size: 12px; color: var(--muted); padding-top: 1px; }
.ck dd { margin: 0 0 4px; overflow-wrap: anywhere; }

/* validate */
.who3 { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); margin: 0 0 14px; padding: 0; list-style: none; }
.who3 li { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r); padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
.who3 li.done { background: var(--stone); }
ol.asks { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; }

/* sources */
ol.src { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 13.5px; }
ol.src li:target { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
.url { font: 400 12px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

footer.end { margin-top: 36px; padding: 18px; border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--surface); }
footer.end h2 { font: 500 20px/1.25 var(--serif); margin: 0 0 6px; }
.fine { margin-top: 16px; font-size: 12px; color: var(--muted); }
.err { margin: 24px 0; padding: 14px; border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); }

@media print {
  /* (0,2,0) selectors placed last, so print wins over the dark-mode tokens too */
  :root:not([data-print]), :root[data-theme="dark"], :root[data-theme="light"] { --paper: #fff; --surface: #fff; --stone: #f1f0ec; --ink: #000; --ink-soft: #111; --muted: #444; --hairline: #ccc; --rule: #999; --on-ink: #fff; }
  body { font-size: 11pt; background: #fff; }
  .bar .tools, nav.path, .scrollhint { display: none; }
  header.top { min-height: 0; }
  .pc.cp a, .st.now { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .wrap { max-width: none; padding: 0; }
  section.s { break-inside: auto; }
  .card, .job, ol.steps > li, ol.check > li, .prow, .pitems li, .who3 li, .wire, table.t tr { break-inside: avoid; }
  .shead { break-after: avoid; }
  .job.first, .wire .rg.cp, .step.now, .ev.confirmed, .kind.approval { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a.piece::after, ol.src a::after { content: ""; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="tag">/user-map</span>
    <span class="tools">
      <button class="btn" type="button" id="theme" aria-label="Theme: auto, light or dark">Theme: Auto</button>
      <button class="btn" type="button" id="print">Print</button>
    </span>
  </div>
  <noscript><p class="err">This page draws the map with JavaScript. The same map is in <code>user-map.md</code> and <code>user-map.json</code> next to this file.</p></noscript>
  <main id="map"></main>
</div>

<script type="application/json" id="user-map-data">
{
  "schema": "user-map/1",
  "meta": {
    "role": "‹Role or team›",
    "function": "‹Function or department›",
    "app": "‹The software they work in›",
    "route": "own-app",
    "shape": "‹one of: one request → approval chain · review against a playbook · exception queue · Q&A with a write at the end · workspace assist›",
    "building": "‹Where the copilot gets built: your web app, your app embedded in the vendor's tool, a panel inside the software, or Slack or Teams›",
    "date": "‹YYYY-MM-DD›",
    "preparedFor": "‹Developer or team›",
    "research": "‹web | no-web›",
    "headline": "‹Five to nine words: what the copilot is and where it lives›",
    "path": { "role": "‹One line: what this role does›", "software": "‹One line: the software and its UI pattern›", "copilot": "‹One line: where the copilot sits and where its work lands›" },
    "oneLine": "‹One sentence: a copilot that lives in ‹surface› of ‹app›, reads ‹…›, does ‹…›, and waits for ‹person› before ‹write›.›"
  },
  "role": {
    "summary": "‹Who they are, what they own, who they work with.›",
    "measuredOn": [{ "text": "‹What their manager measures›", "ev": "assumed" }],
    "day": [{ "label": "‹Where the day goes›", "share": 100, "ev": "assumed" }],
    "people": [{ "name": "‹Who they hand off to or wait on›", "relation": "‹How›", "ev": "assumed" }]

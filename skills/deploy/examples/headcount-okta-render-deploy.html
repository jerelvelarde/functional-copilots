v","title":"Environment and secrets","items":[{"id":"env-inventory","status":"done","title":"Every variable named, per environment","what":"The table above.","why":"A missing `AUTH_OKTA_*` fails at the first sign-in; a stray key on the wrong service spends the wrong budget.","how":"What the CopilotKit Runtime's server reads: `BuiltInAgent`'s `OPENAI_API_KEY`, the app's `COPILOT_MODEL`, and `COPILOTKIT_TELEMETRY_DISABLED`. The `AUTH_*`, `ALLOW_REAL_MODEL` and `CPK_INTELLIGENCE_*` names arrive with `auth-gate`, `mock-default-prod` and `state-runner`; add them to `.env.example` then (snippet). Names only; `.env.local` was not opened. `copilotModel()` (`server-data.ts:26`) needs `OPENAI_API_KEY` even when `COPILOT_MODEL` names another provider: check it before switching.","files":["src/lib/server-data.ts",".env.example","render.yaml"],"doneWhen":"Every name the code reads is in the table, and `.env.example` lists them without values.","evidence":"The code reads `OPENAI_API_KEY` and `COPILOT_MODEL` only (`server-data.ts:25-26,37`; grep of `env.X` across `src/`). Both are in `.env.example` (lines 3 and 5), with `COPILOTKIT_TELEMETRY_DISABLED` (line 10)."},{"id":"no-secrets-in-build","status":"done","title":"No secret in the repo, the build or the browser","what":"Keys live only in Render's variable store.","why":"A key in git history or the client bundle is public for good.","how":"The browser gets only `runtimeUrl` on `CopilotKitProvider`; every key stays on the `CopilotRuntime` server. No `NEXT_PUBLIC_` variable; every secret in `render.yaml` is `sync: false` or `generateValue: true`.","links":[{"label":"Authentication","href":"https://docs.copilotkit.ai/auth"},{"label":"Render environment variables","href":"https://render.com/docs/configure-environment-variables"}],"files":["src/lib/server-data.ts","render.yaml",".gitignore"],"doneWhen":"The ignore file covers env files, and no key variable is read in client code.","evidence":"No `NEXT_PUBLIC_` in `src/` (grep). `server-data.ts` is imported only by `page.tsx` (a server component) and `route.ts`. `.gitignore:34`. The page generator's credential-shape check passed on this checklist."},{"id":"keys-per-env","status":"ask","title":"Separate keys per environment","what":"Its own OpenAI key, Intelligence project and Okta app integration for local, staging and production.","why":"A leak or a runaway loop on staging can't spend production's budget, and rotating one key doesn't take the other environment down.","how":"One CopilotKit Intelligence project per environment (its own `CPK_INTELLIGENCE_API_KEY` and Learning Space), one OpenAI project per environment for `BuiltInAgent`'s key, and one Okta OIDC web app per environment with only its own redirect URI (`https://\u003chost>/api/auth/callback/okta`). Render generates a separate `AUTH_SECRET` per service.","links":[{"label":"Intelligence","href":"https://docs.copilotkit.ai/intelligence/overview"},{"label":"OpenAI production practices","href":"https://platform.openai.com/docs/guides/production-best-practices"},{"label":"Okta OIDC app integration","href":"https://help.okta.com/en-us/content/topics/apps/apps_app_integration_wizard_oidc.htm"}],"files":["render.yaml"],"doneWhen":"Each environment's keys come from its own OpenAI project, Intelligence project and Okta app.","evidence":"Yours to create (assumed: two of each). `render.yaml` already asks for them per service."},{"id":"telemetry","status":"ask","title":"Telemetry choice made","what":"Whether the CopilotKit runtime sends usage telemetry from staging and production.","why":"It is on by default and can include error messages from failed runs, which here could quote HR data.","how":"`COPILOTKIT_TELEMETRY_DISABLED=true` (or `DO_NOT_TRACK=1`) turns it off; it is in `render.yaml` for both services. Delete the line to keep it on.","links":[{"label":"Telemetry","href":"https://docs.copilotkit.ai/telemetry"}],"files":["render.yaml",".env.example","README.md"],"doneWhen":"The choice is in the e mock","what":"The README demo, played against the mock with the real tool handlers.","why":"It proves the tools, cards, approval gate and store with no key and no network, before every deploy.","how":"`demo-script.test.ts` plays the demo against the mock with the same handlers the app registers through `useFrontendTool` and `useHumanInTheLoop`.","files":["src/lib/demo-script.test.ts","src/lib/mock-model.ts"],"doneWhen":"`npm test` passes it.","evidence":"`npm test` in this run: 10 files, 112 tests passed, including `demo-script.test.ts`."}]},{"id":"auth","title":"Sign-in, scope and data","items":[{"id":"spec-scope","status":"ask","title":"This deploy fits the approved spec","what":"Who will use it, on whose data, with which model, compared with the approved spec's v1 and its out-of-scope list.","why":"A pilot with real approvers needs sign-in, a server store and the real model; if the spec left them out, deploying anyway ships a demo to people who will treat it as real.","how":"Read `docs/copilot/copilot-spec.md`. If the request needs what it ruled out, mark this blocked, name each missing piece (sign-in with `identifyUser`, a server store, the real model on `BuiltInAgent`), and send it back to `/functional-copilot` for a spec change and a build. A spec's data decisions (Intelligence off, the real model off until agreed) win over this skill's defaults.","footnote":"The narrower deploy the spec supports (a rehearsal, a drafting pilot) can go ahead meanwhile.","files":["src/lib/store.ts","src/app/api/copilotkit/[[...slug]]/route.ts"],"doneWhen":"The audience, data and model match the spec, or the spec has been changed and built to match.","evidence":"No `docs/copilot/copilot-spec.md` in this repo, and the starter's v1 is a one-browser demo. Running it for real next week needs sign-in, a server store and the real model it doesn't have: put them in a spec with `/functional-copilot` and build them, or deploy as a drafting pilot (assumed in the decisions)."},{"id":"shared-state","status":"blocked","title":"Shared state lives on the server, keyed by user","what":"Anything more than one person relies on (requests, reviews, approvals) is stored on the server per signed-in user, and approvals are checked there.","why":"Today everyone is Dana Kim, the approvals view acts as every approver, and requests live in each browser's localStorage. Behind Okta it's safe to open, but nobody else sees a request and anyone can approve as anyone.","how":"Move state to a server store keyed by user: the `useFrontendTool` handlers all write through `store.ts`, so back that one store with a server API. Resolve the user with `identifyUser(request)` on `CopilotRuntime` from the Okta session, pass the same user to the app in place of `CURRENT_USER` (so `useAgentContext` describes the real requester), and enforce each approval on the server against the named approver.","links":[{"label":"Authentication","href":"https://docs.copilotkit.ai/auth"},{"label":"Thread lifecycle","href":"https://docs.copilotkit.ai/threads-lifecycle"}],"doneWhen":"Two signed-in people see the same request, and only the named approver's approval counts, checked by a server test.","footnote":"A drafting pilot avoids this for next week: HR ops builds the case with the copilot and files it in today's approval process, with Reset demo and the approvals view hidden.","files":["src/lib/store.ts","src/lib/headcount.ts","src/lib/app-context.ts","src/components/panels/ApprovalsInbox.tsx","src/app/page.tsx"],"evidence":"Waits on a server store and server-checked approvals, or on your choice of a drafting pilot (assumed). `store.ts:15` and `:110` persist to `localStorage`; `headcount.ts:61` `CURRENT_USER = getPerson(\"dana\")`, sent to the agent by `app-context.ts:22-23`; `ApprovalsInbox.tsx:183` lets you act as any approver."},{"id":"auth-gate","status":"todo","title":"Okta sign-in in front of the runtime and the app","what":"No runtime request and no page without an Okta session.","why":"Without it, anyone who finds the Render URL runs the agent on your OpenAI key; the `onrender.com` address stays public even with a company domain.","how":"`hooks.onRequest` on `createCopilotRuntimeHandler` throws a 401 `Response` when there's no Okta session. The session comes from Auth.js with its Okta provider (`src/auth.ts`, its route, and `src/proxy.ts` for pages); the cookie rides along same-origin, so `CopilotKitProvider` needs no `headers`. Snippets below; then a test for each refusal.","footnote":"An identity-aware proxy your platform team already runs (Okta Access Gateway, Cloudflare Access, oauth2-proxy) can replace `proxy.ts` for pages. Keep `hooks.onRequest` anyway, so a misconfigured proxy or the raw Render URL never exposes the agent.","links":[{"label":"Authentication","href":"https://docs.copilotkit.ai/auth"},{"label":"Lifecycle hooks","href":"https://docs.copilotkit.ai/runtime-server-adapter#lifecycle-hooks"},{"label":"Auth.js Okta provider","href":"https://authjs.dev/getting-started/providers/okta"},{"label":"Next.js proxy.ts","href":"https://nextjs.org/docs/app/api-reference/file-conventions/proxy"}],"files":["src/app/api/copilotkit/[[...slug]]/route.ts","src/components/HeadcountApp.tsx"],"doneWhen":"Without a session, `/` and `/api/copilotkit/info` get a redirect to Okta or a 401, never a page or a stream (`scripts/smoke-deploy.sh` passes).","evidence":"Open today: `route.ts:8-9` says no auth, `route.ts:24` passes no `hooks`. `scripts/smoke-deploy.sh http://127.0.0.1:3100` in this run: `/` 200 and `/api/copilotkit/info` 200 without a session (FAIL)."},{"id":"identify-user","status":"todo","title":"The runtime knows who is asking","what":"`identifyUser` on `CopilotRuntime` returns the Okta user's email and name from the session.","why":"Each thread then belongs to the person who started it, Intelligence keeps each user's threads apart, and the logs name who ran what.","how":"`identifyUser: async () => signedInUser()` from the verified Auth.js session (route snippet), never from a user id the browser sends. Intelligence mode requires it.","links":[{"label":"Authentication","href":"https://docs.copilotkit.ai/auth"}],"files":["src/app/api/copilotkit/[[...slug]]/route.ts"],"doneWhen":"Two Okta users each see only their own threads; user B gets a refusal for user A's thread id.","evidence":"`route.ts:22` sets no `identifyUser`."},{"id":"thread-access","status":"done","title":"Threads can't be listed by others","what":"Thread routes refuse callers who don't own the thread.","why":"Chat history holds the business cases people worked on.","how":"Keep `threads.access` on `CopilotRuntime` at its default, `\"owner\"`; with `identifyUser`, each user reaches only their own threads. In Intelligence mode, guard the routes docs.copilotkit.ai/auth lists as unscoped in `hooks.onBeforeHandler`.","links":[{"label":"Authentication","href":"https://docs.copilotkit.ai/auth"}],"files":["src/app/api/copilotkit/[[...slug]]/route.ts"],"doneWhen":"`GET /api/copilotkit/threads` without identity returns 403 (401 or a redirect once Okta is in front).","evidence":"Probed the dev server on 127.0.0.1:3100, which serves the original starter folder; its `src/`, `package.json` and `next.config.ts` are identical to this copy (`diff -rq`, no differences). `GET /api/copilotkit/threads`: 403 `thread_access_not_configured`."},{"id":"real-model-gate","status":"blocked","title":"The real model only behind Okta","what":"`OPENAI_API_KEY` and `ALLOW_REAL_MODEL=true` only on services where Okta refuses unsigned calls.","why":"The key turns every unsigned request into spend on your account.","how":"Give `BuiltInAgent` the real model only on a service where `hooks.onRequest` refuses unsigned calls: paste the key into Render after `scripts/smoke-deploy.sh` passes against that service.","links":[{"label":"Authentication","href":"https://docs.copilotkit.ai/auth"}],"files":["render.yaml","src/lib/server-data.ts"],"doneWhen":"Smoke reads pass on a service before its `OPENAI_API_KEY` is set.","evidence":"Waits on `auth-gate` (no sign-in yet) and `mock-default-prod` (no flag yet)."},{"id":"model-provider-data","status":"ask","title":"The data owner agreed to what goes to the model provider","what":"Every run sends the provider of `BuiltInAgent`'s model the context, the conversation and the tool results.","why":"On a real model, contract text, people's pay or customers' records leave the company with each message.","how":"Name the provider and what each run sends (`useAgentContext`, messages, tool results). Get the data owner's yes (Legal and Security, or HR) and check the provider account's data terms before `ALLOW_REAL_MODEL=true` or a key goes on any environment. `COPILOTKIT_TELEMETRY_DISABLED=true` turns off the second flow, the runtime's telemetry.","links":[{"label":"Copilot Runtime","href":"https://docs.copilotkit.ai/backend/copilot-runtime"}],"doneWhen":"Who agreed, and when, is written here before any environment gets a key.","files":["src/lib/app-context.ts"],"evidence":"Same decision as `hr-data`: HR and Security's yes on what reaches OpenAI. The plan, the draft and the requester go with every run through `useAgentContext` (`app-context.ts`)."},{"id":"preview-protection","status":"todo","title":"Staging is behind Okta too","what":"Staging carries a real key, so it gets the same gate as production.","why":"A staging URL is as reachable as production's, and staging keys spend real money.","how":"The same `hooks.onRequest` gate on staging, with the staging Okta app (HR ops plus whoever tests). Render preview environments stay off: `render.yaml` doesn't enable them.","links":[{"label":"Authentication","href":"https://docs.copilotkit.ai/auth"},{"label":"Render Blueprint spec","href":"https://render.com/docs/blueprint-spec"}],"files":["render.yaml"],"doneWhen":"The staging URL, opened in a private window, redirects to Okta.","evidence":"Check it when staging exists; `render.yaml` has no `previews` setting."}]},{"id":"protect","title":"Protection: rate limits, spend caps, allowed origins","items":[{"id":"rate-limit","status":"todo","title":"Rate limits on agent runs, per Okta user","what":"A cap on `agent/run` per signed-in user, answering 429.","why":"Every run is an OpenAI call. A stuck tab or a script with a valid session could loop.","how":"`hooks.onBeforeHandler` on `createCopilotRuntimeHandler` counts `route.method === \"agent/run\"` per user and throws a 429 `Response` over the limit (route snippet; 30 a minute is an assumed start). One instance, so an in-process `Map` is enough.","footnote":"A CDN or WAF rate-limit rule, if your company routes Render traffic through one.","links":[{"label":"Lifecycle hooks","href":"https://docs.copilotkit.ai/runtime-server-adapter#lifecycle-hooks"}],"files":["src/app/api/copilotkit/[[...slug]]/route.ts"],"doneWhen":"A burst above the limit on staging gets 429 and the chat shows a readable message.","evidence":"Nothing limits runs today: `route.ts:24` passes no `hooks`."},{"id":"spend-caps","status":"ask","title":"Spend caps at OpenAI and Render","what":"A monthly budget with an alert on each OpenAI project, and a known host bill.","why":"A cap still works when every other control has failed.","how":"Bound what CopilotKit spends first (`maxSteps` and the model id on `BuiltInAgent`), watch usage in CopilotKit Intelligence analytics, then cap the bills: a monthly budget and alert on the staging and production OpenAI projects (you set them). Render: one Standard instance per service and no autoscaling, so the bill is flat.","links":[{"label":"Intelligence analytics","href":"https://docs.copilotkit.ai/intelligence/analytics"},{"label":"OpenAI production practices","href":"https://platform.openai.com/docs/guides/production-best-practices"}],"files":["render.yaml"],"doneWhen":"Both OpenAI budgets are set and their numbers are written here.","evidence":"What monthly budget for staging, and for production? Not invented here."},{"id":"run-bounds","status":"todo","title":"Each run is bounded","what":"How many tool rounds one run may take, and which model it runs.","why":"A loop of tool calls on a real model is a bill and a slow screen.","how":"`maxSteps` on `BuiltInAgent`: the route sets none, so the default of 1 holds. That's enough while every tool is a `useFrontendTool` (each result starts a new run). Set 2 or more before adding a server or MCP tool, or the run ends at the tool result with no reply.","links":[{"label":"Copilot Runtime","href":"https://docs.copilotkit.ai/backend/copilot-runtime"}],"files":["src/app/api/copilotkit/[[...slug]]/route.ts"],"doneWhen":"`maxSteps` is set on purpose, the longest demo run finishes with a reply, and stays under it.","evidence":"`route.ts:15-20` sets no `maxSteps`; the installed runtime's default is 1 (`@copilotkit/runtime` 1.84.1, `dist/agent/index.d.mts:296`)."},{"id":"origins","status":"done","title":"Same origin, no CORS headers","what":"The app and the runtime share one origin.","why":"With no CORS headers, other sites' scripts can't read the runtime's responses.","how":"Leave `cors` unset on `createCopilotRuntimeHandler`.","links":[{"label":"CORS configuration","href":"https://docs.copilotkit.ai/runtime-server-adapter#cors-configuration"}],"files":["src/app/api/copilotkit/[[...slug]]/route.ts","src/components/HeadcountApp.tsx"],"doneWhen":"The runtime sends no CORS headers.","evidence":"`route.ts:24` sets no `cors`; the provider uses the relative `runtimeUrl=\"/api/copilotkit\"` (`HeadcountApp.tsx:43`)."},{"id":"hr-data","status":"ask","title":"Real HR data: what goes in, who downloads it, what reaches OpenAI","what":"The plan, comp bands, people and policy the copilot works from, and the date it thinks it is.","why":"`src/data/` is the fictional Northstar company. `headcount.ts` imports it into client code, so every signed-in browser downloads every comp band and the people list. `STORY_DATE` pins today to 2026-11-05, so next week's submissions are stamped Nov 5 and the 60-day lead time is checked against it.","how":"Everything in `useAgentContext` (the plan, the draft, the user) goes to OpenAI with each run. Decide in `/secure-governance`: which data goes in for the pilot, who may see which bands (serve them per user from the server instead of bundling), unpin `STORY_DATE`, and confirm your OpenAI organization's data controls meet HR's policy.","links":[{"label":"OpenAI production practices","href":"https://platform.openai.com/docs/guides/production-best-practices"}],"files":["src/lib/headcount.ts","src/lib/app-context.ts","src/data/comp-bands.json","src/data/company.json","src/data/headcount-plan.json","PRODUCT.md"],"doneWhen":"Real data from a source HR owns, visible only to the right people, today's date used, and OpenAI data handling approved.","evidence":"Which data, and who may see it? `headcount.ts:8-10` import the JSON; `:26` `STORY_DATE`; `HeadcountApp.tsx:6` is `\"use client\"` and imports from it at `:21`; `PRODUCT.md:53` fictional company."}]},{"id":"ops","title":"Operations: health, logs, traces, staging, rollback","items":[{"id":"health","status":"todo","title":"Health check at /api/health","what":"A route Render calls before routing traffic, answering without a session or a model call.","why":"Once Okta is in front, every deploy would fail its check on a path that needs a session.","how":"`GET /api/copilotkit/info` proves the runtime loaded, but `hooks.onRequest` will answer it 401; so add `src/app/api/health/route.ts` (snippet) outside the runtime's basePath and excluded from `proxy.ts`'s matcher. `render.yaml` already points at it.","links":[{"label":"Endpoint modes","href":"https://docs.copilotkit.ai/runtime-server-adapter#multi-route-vs-single-route"},{"label":"Render health checks","href":"https://render.com/docs/health-checks"}],"files":["render.yaml"],"doneWhen":"Render shows the check passing on the new deploy, and `scripts/smoke-deploy.sh` reports `/api/health` 200.","evidence":"No such route today: `GET /api/health` returned 404 on the dev server in this run."},{"id":"logs","status":"todo","title":"Logs found, readable and clean","what":"Each run logged with its status and the Okta user's email; each refusal and error with its reason.","why":"When an HR ops user says the copilot failed, the log should say who, when and why.","how":"Log from the runtime's `hooks`: `onResponse` for each run's status, `onError` for failures, with the user id from `identifyUser` (never a token or prompt). Route snippet. Read them in each Render service's Logs tab.","links":[{"label":"Lifecycle hooks","href":"https://docs.copilotkit.ai/runtime-server-adapter#lifecycle-hooks"},{"label":"Render logs","href":"https://render.com/docs/logging"}],"files":["src/app/api/copilotkit/[[...slug]]/route.ts","src/lib/server-data.ts"],"doneWhen":"You've read one staging deploy's logs: the model line and a run line are there, and no secret is.","evidence":"Today the only log line is the mock's (`server-data.ts:42`); no per-run logging."},{"id":"traces","status":"todo","title":"Traces and learning through Intelligence","what":"Per-call cost now; per-conversation history and Automatic Learning once Intelligence is on.","why":"The Insights panel's lessons come from a local classifier over a fixture file; real learning needs real threads, reviewed by a person.","how":"CopilotKit Intelligence: threads, analytics and insights, and Automatic Learning into the `headcount-approvals` Learning Space per environment, with skills a person publishes. Trajectories through `@copilotkit/learning` are off on hosted Intelligence today, so don't plan on them yet. Per-call cost: the OpenAI project's usage, per environment.","links":[{"label":"Intelligence","href":"https://docs.copilotkit.ai/intelligence/overview"},{"label":"Learning","href":"https://docs.copilotkit.ai/learning"},{"label":"Intelligence analytics","href":"https://docs.copilotkit.ai/intelligence/analytics"}],"files":["src/lib/learning.ts","src/app/api/copilotkit/[[...slug]]/route.ts","starters/open-harvey/src/lib/intelligence.ts (workshop repo)"],"doneWhen":"A staging run shows up in the staging Intelligence project, and per-environment cost is visible in OpenAI.","evidence":"Waits on `state-runner`: no `intelligence` on `CopilotRuntime` (`route.ts:22`). README lines 134-138 name Intelligence as the production path for learning."},{"id":"staging","status":"todo","title":"Staging before production","what":"`headcount-copilot-staging`: same build, start command and health check as production, its own keys and URL.","why":"The first deploy of a change should not be the one HR ops sees.","how":"The same build and `CopilotRuntime` config as production, with its own `CPK_INTELLIGENCE_API_KEY`, Learning Space, OpenAI key and Okta app. Staging deploys every push; smoke it; then Manual Deploy on `headcount-copilot-prod` with that commit.","links":[{"label":"Runtime deployment","href":"https://docs.copilotkit.ai/runtime-server-adapter"},{"label":"Render Blueprint spec","href":"https://render.com/docs/blueprint-spec"}],"files":["render.yaml","scripts/smoke-deploy.sh"],"doneWhen":"Staging exists and the smoke test passed there.","evidence":"Defined in `render.yaml`; doesn't exist yet."},{"id":"rollback","status":"todo","title":"Rollback known and tried","what":"How to put the previous deploy back.","why":"The middle of an incident is the wrong time to learn it.","how":"Roll back the app and the CopilotKit Runtime together: `@copilotkit/react-core` and `@copilotkit/runtime` ship in one build, so redeploying an earlier deploy from the service's Events list in Render restores both. Variables aren't part of a build: undo a variable change by hand.","links":[{"label":"Render rollbacks","href":"https://render.com/docs/rollbacks"}],"files":["render.yaml"],"doneWhen":"You have rolled staging back once.","evidence":"Try it on staging after the second deploy."},{"id":"inspector","status":"done","title":"Web inspector off in the deployed app","what":"The CopilotKit web inspector (`@copilotkit/web-inspector`) shows each run's AG-UI events in the browser.","why":"Watching one run locally is the fastest way to tell a Render problem from an agent problem; HR ops shouldn't see it.","how":"`enableInspector` on `CopilotKitProvider` is `false`; it is always off in production builds anyway. Flip it locally and watch one full run before the first deploy.","files":["src/components/HeadcountApp.tsx"],"doneWhen":"`enableInspector` is off in the code, so the deployed page can't show it.","evidence":"`HeadcountApp.tsx:43` `enableInspector={false}`."}]},{"id":"smoke","title":"Smoke test after the deploy","items":[{"id":"smoke-reads","status":"todo","title":"Reads against each URL, no session","what":"`scripts/smoke-deploy.sh \u003curl>`: health 200; `/`, `/api/copilotkit/info` and `/api/copilotkit/threads` refused without a session.","why":"Catches a missing gate, a wrong start command or a broken health route in seconds, before the key is set.","how":"`/api/health` 200; `/` refused by `proxy.ts`; `{basePath}/info` and `{basePath}/threads` refused by `proxy.ts` or `hooks.onRequest` (a redirect to Okta or 401). Run against staging, then production. It follows no redirects and calls no model.","cmd":"scripts/smoke-deploy.sh https://\u003cstaging-host>","links":[{"label":"Endpoint modes","href":"https://docs.copilotkit.ai/runtime-server-adapter#multi-route-vs-single-route"}],"files":["scripts/smoke-deploy.sh"],"doneWhen":"Four ok lines on each URL.","evidence":"Script written and run this session against today's ungated dev server: four FAILs (`/api/health` 404, `/` 200, `/info` 200, `/threads` 403), as expected before the gate."},{"id":"smoke-flows","status":"todo","title":"The demo, clicked through on staging, signed in","what":"README demo steps 1-7 in a browser on staging, through Okta.","why":"The only check that proves streaming, the cards, the approval card and the live edit through Render, on the real model.","how":"Replies stream; every `useComponent` card renders (cost, policy, re-check); the `useHumanInTheLoop` card refuses to submit before Submit for approval; `useFrontendTool` tools fill the Business case; the live edit to 225000 adds the CFO; the badge reads `gpt-5.4-mini`. Then: a second Okta user can't open the first user's thread; a burst gets the 429 message. Reset demo uses `window.confirm`, which automated browsers decline.","files":["README.md"],"doneWhen":"Every step behaves as on the laptop, on the real model.","evidence":"Not run: staging doesn't exist yet. The demo passes on the mock locally (`mock-tested`)."},{"id":"smoke-logs","status":"todo","title":"Server side clean after the flows","what":"The staging service's logs after the flows.","why":"Errors the UI swallowed show up here.","how":"Read the runtime's logs right after the flows: one `[copilot] Running on openai/gpt-5.4-mini.` line, `hooks.onResponse` run lines with emails, the 429 you caused, no `hooks.onError` entries, no key or token.","files":["src/lib/server-data.ts","src/app/api/copilotkit/[[...slug]]/route.ts"],"doneWhen":"The expected model line, no errors, no secrets.","evidence":"After the staging deploy."}]},{"id":"golive","title":"Go live: the steps that wait for your yes","items":[{"id":"golive-project","status":"ask","needsYes":true,"title":"Repo pushed; Okta apps, Intelligence projects and the Render Blueprint created","what":"The repo on your company Git host; two Okta OIDC web app integrations; two Intelligence projects with a Learning Space each; the Blueprint in your company's Render workspace.","why":"Each creates something in your company's accounts.","how":"Push (commands list). Okta: a staging and a production app, sign-in redirect `https://\u003chost>/api/auth/callback/okta`, assigned to HR ops. Intelligence: the environment's project and the `headcount-approvals` Learning Space in the CopilotKit Intelligence dashboard. Render: a Blueprint from the dashboard, which creates both services from `render.yaml`.","links":[{"label":"Okta OIDC app integration","href":"https://help.okta.com/en-us/content/topics/apps/apps_app_integration_wizard_oidc.htm"},{"label":"Intelligence quickstart","href":"https://docs.copilotkit.ai/intelligence/quickstart"},{"label":"Render Blueprint spec","href":"https://render.com/docs/blueprint-spec"}],"doneWhen":"You said yes and both services exist (the first deploy fails its health check until `/api/health` is in the code, which is intended).","evidence":"Your yes, after `auth-gate`, `health` and `mock-default-prod` are merged."},{"id":"golive-vars","status":"ask","needsYes":true,"title":"Variables set on Render","what":"The `sync: false` values for each service, pasted in Render's dashboard by you.","why":"Production secrets are yours to set; they never pass through this session.","how":"Render's `sync: false` prompt asks for `AUTH_OKTA_ID`, `AUTH_OKTA_SECRET`, `AUTH_OKTA_ISSUER` and `OPENAI_API_KEY` per service (and `CPK_INTELLIGENCE_API_KEY` once uncommented). Set `OPENAI_API_KEY` last, after the smoke reads pass on that service.","links":[{"label":"Render environment variables","href":"https://render.com/docs/configure-environment-variables"}],"doneWhen":"The variable names on each service match the table.","evidence":"Your yes and your values, per service."},{"id":"golive-deploy","status":"blocked","needsYes":true,"title":"Deploy staging, then production","what":"Staging builds on push; production by Manual Deploy of the commit staging passed.","why":"It puts the copilot in front of HR ops on your OpenAI key.","how":"Push to the default branch (staging), smoke it, then Manual Deploy on `headcount-copilot-prod` with that commit.","links":[{"label":"Render Blueprint spec","href":"https://render.com/docs/blueprint-spec"}],"doneWhen":"Both services show healthy and the smoke reads pass on both.","evidence":"Waits on `auth-gate`, `health` and `mock-default-prod`, and on `shared-state`."},{"id":"golive-share","status":"ask","needsYes":true,"title":"Domain and sharing","what":"A company domain for production, and the link to HR ops.","why":"Once HR ops has the link, they'll use it with real requests.","how":"Add the custom domain on the Render service, then add `https://\u003cdomain>/api/auth/callback/okta` to the production Okta app's redirect URIs. Share only after the production smoke test passes.","links":[{"label":"Okta OIDC app integration","href":"https://help.okta.com/en-us/content/topics/apps/apps_app_integration_wizard_oidc.htm"}],"doneWhen":"The smoke test passed on that URL before it was shared.","evidence":"Your yes to the domain and to sharing."}]}],"snippets":[{"title":"Render Blueprint (written to the repo)","file":"render.yaml","code":"# Render Blueprint for the headcount copilot: one web service for staging, one for production.\n# Prepared by /deploy on 2026-11-05; nothing has been created on Render. Checklist: docs/copilot/deploy.html\n#\n# Create it from the Render dashboard (New > Blueprint > this repo) only after the sign-in gate, the\n# health route and the real-model gate are in the code (checklist items auth-gate, health,\n# mock-default-prod). /api/health does not exist yet, so a deploy before then fails its health check\n# and never takes traffic.\n#\n# Secrets are `sync: false`: Render asks for each value in its dashboard when the Blueprint is created.\n# AUTH_SECRET is generated by Render. No secret value belongs in this file.\n# If this app is a subfolder of a larger repo, move this file to the repo root and add `rootDir: \u003cpath>`\n# to both services.\n\nservices:\n  - type: web\n    name: headcount-copilot-staging\n    runtime: node\n    plan: standard # 2 GB. The in-memory runner keeps up to about 512 MB of thread history, plus Next.js.\n    region: oregon # Assumed: use the region your company keeps HR data in\n    numInstances: 1 # one process: in-memory runs and the per-user rate limit live in it\n    buildCommand: npm ci && npm run build\n    startCommand: npx next start -H 0.0.0.0 # all interfaces; Next reads $PORT, which Render sets\n    healthCheckPath: /api/health\n    autoDeployTrigger: commit # staging follows every push to the default branch\n    envVars:\n      - key: NODE_VERSION\n        value: \"24\" # the version the tests ran on (v24.16.0)\n      - key: OPENAI_API_KEY # from the STAGING OpenAI project\n        sync: false\n      - key: COPILOT_MODEL\n        value: openai/gpt-5.4-mini # the app's default, pinned so a code change can't switch it silently\n      - key: ALLOW_REAL_MODEL\n        value: \"true\" # read once the mock-default-prod change lands; this service is behind Okta\n      - key: AUTH_SECRET # signs the Okta session cookie\n        generateValue: true\n      - key: AUTH_OKTA_ID # the staging Okta app integration's client ID\n        sync: false\n      - key: AUTH_OKTA_SECRET # the staging Okta app integration's client secret\n        sync: false\n      - key: AUTH_OKTA_ISSUER # your Okta issuer URL, for example https://\u003cyour-okta-domain>/oauth2/default\n        sync: false\n      - key: AUTH_TRUST_HOST\n        value: \"true\" # Render terminates TLS in front of the app\n      - key: COPILOTKIT_TELEMETRY_DISABLED\n        value: \"true\" # Assumed: off for an HR tool (failed-run error messages would leave the company)\n      # CopilotKit Intelligence (checklist item state-runner). Uncomment once the code reads them and the\n      # STAGING Intelligence project and Learning Space exist:\n      # - key: CPK_INTELLIGENCE_ENABLED\n      #   value: \"true\"\n      # - key: CPK_INTELLIGENCE_API_KEY\n      #   sync: false\n      # - key: CPK_INTELLIGENCE_LEARNING_CONTAINER_ID\n      #   value: headcount-approvals\n      # Don't set NODE_ENV here: `next build` and `next start` set it, and NODE_ENV=production during\n      # `npm ci` skips the dev dependencies the build needs (typescript, tailwindcss).\n\n  - type: web\n    name: headcount-copilot-prod\n    runtime: node\n    plan: standard\n    region: oregon # Assumed, as above\n    numInstances: 1\n    buildCommand: npm ci && npm run build\n    startCommand: npx next start -H 0.0.0.0\n    healthCheckPath: /api/health\n    autoDeployTrigger: \"off\" # deploy by hand, with the commit that passed the staging smoke test\n    envVars:\n      - key: NODE_VERSION\n        value: \"24\"\n      - key: OPENAI_API_KEY # from the PRODUCTION OpenAI project\n        sync: false\n      - key: COPILOT_MODEL\n        value: openai/gpt-5.4-mini\n      - key: ALLOW_REAL_MODEL\n        value: \"true\"\n      - key: AUTH_SECRET\n        generateValue: true\n      - key: AUTH_OKTA_ID # the production Okta app integration's client ID\n        sync: false\n      - key: AUTH_OKTA_SECRET\n        sync: false\n      - key: AUTH_OKTA_ISSUER\n        sync: false\n      - key: AUTH_TRUST_HOST\n        value: \"true\"\n      - key: COPILOTKIT_TELEMETRY_DISABLED\n        value: \"true\"\n      # CopilotKit Intelligence, with the PRODUCTION project's key (never staging's):\n      # - key: CPK_INTELLIGENCE_ENABLED\n      #   value: \"true\"\n      # - key: CPK_INTELLIGENCE_API_KEY\n      #   sync: false\n      # - key: CPK_INTELLIGENCE_LEARNING_CONTAINER_ID\n      #   value: headcount-approvals"},{"title":"Okta sign-in with Auth.js (draft, auth-gate)","file":"src/auth.ts","code":"// Okta sign-in for the whole app (Auth.js v5). Reads AUTH_SECRET, AUTH_OKTA_ID, AUTH_OKTA_SECRET and\n// AUTH_OKTA_ISSUER from the environment. Who may sign in is the Okta app's assignment (the HR ops group).\nimport NextAuth from \"next-auth\";\nimport Okta from \"next-auth/providers/okta\";\n\nexport const { handlers, auth, signIn, signOut } = NextAuth({\n  providers: [Okta],\n  session: { strategy: \"jwt\", maxAge: 8 * 60 * 60 }, // a working day, then Okta again\n  callbacks: {\n    // proxy.ts: no session, no page. Okta's group assignment decides who gets one.\n    authorized: ({ auth }) => Boolean(auth?.user?.email),\n  },\n});"},{"title":"Auth.js routes (draft, auth-gate)","file":"src/app/api/auth/[...nextauth]/route.ts","code":"// The Okta sign-in and callback routes: /api/auth/signin, /api/auth/callback/okta, /api/auth/signout.\nimport { handlers } from \"@/auth\";\n\nexport const { GET, POST } = handlers;"},{"title":"Every page behind Okta (draft, auth-gate)","file":"src/proxy.ts","code":"// Next.js 16 proxy (the file formerly called middleware): every page and API route needs an Okta\n// session, except sign-in itself and the health check Render calls.\nexport { auth as proxy } from \"@/auth\";\n\nexport const config = {\n  matcher: [\"/((?!api/auth|api/health|_next/static|_next/image|favicon.ico).*)\"],\n};"},{"title":"The runtime behind Okta: onRequest, identifyUser, rate limit, logs (draft)","file":"src/app/api/copilotkit/[[...slug]]/route.ts","code":"// The runtime, behind Okta: hooks.onRequest refuses callers with no session (a second layer behind\n// proxy.ts), identifyUser scopes each chat thread to its Okta user, and onBeforeHandler rate-limits runs.\n\nimport { BuiltInAgent, CopilotRuntime, createCopilotRuntimeHandler } from \"@copilotkit/runtime/v2\";\nimport { auth } from \"@/auth\";\nimport { agentInstructions } from \"@/lib/agent-instructions\";\nimport { agentModel, readPolicies } from \"@/lib/server-data\";\n\nconst agent = new BuiltInAgent({\n  model: agentModel(),\n  prompt: agentInstructions(readPolicies()),\n  maxSteps: 1, // one model step per run (the default, made explicit); frontend tool results start the next run\n});\n\n/** The signed-in Okta user, from the session cookie. Never from the request body. */\nasync function signedInUser() {\n  const session = await auth();\n  const email = session?.user?.email;\n  return email ? { id: email, name: session.user?.name ?? email } : null;\n}\n\nconst runtime = new CopilotRuntime({\n  agents: { default: agent },\n  identifyUser: async () => {\n    const user = await signedInUser();\n    if (!user) throw new Error(\"identifyUser ran without a session\"); // onRequest refuses first\n    return user;\n  },\n});\n\nconst RUNS_PER_MINUTE = 30; // Assumed. Count runs in one staging pass of the demo, then set it with headroom.\nconst recentRuns = new Map\u003cstring, number[]>(); // in-process: right for one instance (numInstances: 1)\n\nconst handler = createCopilotRuntimeHandler({\n  runtime,\n  basePath: \"/api/copilotkit\",\n  hooks: {\n    onRequest: async () => {\n      if (!(await signedInUser())) throw new Response(\"Unauthorized\", { status: 401 });\n    },\n    onBeforeHandler: async ({ route }) => {\n      if (route.method !== \"agent/run\") return;\n      const user = await signedInUser();\n      if (!user) throw new Response(\"Unauthorized\", { status: 401 });\n      const now = Date.now();\n      const runs = (recentRuns.get(user.id) ?? []).filter((t) => now - t \u003c 60_000);\n      if (runs.length >= RUNS_PER_MINUTE) {\n        console.warn(`[copilot] 429 user:${user.id} over ${RUNS_PER_MINUTE} runs a minute`);\n        throw Response.json(\n          { error: \"rate_limited\", message: \"Too many requests in a minute. Wait a moment and try again.\" },\n          { status: 429 },\n        );\n      }\n      runs.push(now);\n      recentRuns.set(user.id, runs);\n    },\n    onResponse: async ({ route, response }) => {\n      if (route.method !== \"agent/run\") return;\n      const user = await signedInUser();\n      console.info(`[copilot] run agent:${route.agentId} status:${response.status} user:${user?.id ?? \"anonymous\"}`);\n    },\n    onError: async ({ route, error }) => {\n      // The message only: never the request, the prompt or a token.\n      console.error(`[copilot] error route:${route?.method ?? \"unrouted\"} ${error instanceof Error ? error.message : \"unknown\"}`);\n    },\n  },\n});\n\nexport const GET = (request: Request) => handler(request);\nexport const POST = (request: Request) => handler(request);"},{"title":"Health route (draft, health)","file":"src/app/api/health/route.ts","code":"// Liveness for Render's health check: outside the runtime's basePath and outside the Okta proxy, so the\n// checker needs no session. It never calls the model.\nexport const dynamic = \"force-dynamic\";\n\nexport function GET() {\n  return Response.json({ ok: true });\n}"},{"title":"Real-model gate (draft, mock-default-prod)","file":"src/lib/server-data.ts","code":"// Replace copilotModel() and agentModel() in src/lib/server-data.ts. A production build runs the real\n// model only where ALLOW_REAL_MODEL=true, which render.yaml sets only on the Okta-gated services.\ntype Env = Record\u003cstring, string | undefined>;\n\n/** Why the scripted mock runs, or null when the real model does. */\nexport function mockReason(env: Env = process.env): string | null {\n  if (env.COPILOT_MODEL?.trim() === MOCK_MODEL) return \"COPILOT_MODEL=mock\";\n  if (!env.OPENAI_API_KEY?.trim()) return \"no OPENAI_API_KEY\";\n  if (env.NODE_ENV === \"production\" && env.ALLOW_REAL_MODEL !== \"true\") {\n    return \"production build without ALLOW_REAL_MODEL=true; OPENAI_API_KEY is ignored\";\n  }\n  return null;\n}\n\nexport function copilotModel(env: Env = process.env): string {\n  return mockReason(env) ? MOCK_MODEL : env.COPILOT_MODEL?.trim() || DEFAULT_MODEL;\n}\n\nexport function agentModel(): string | LanguageModelV3 {\n  const reason = mockReason();\n  if (!reason) {\n    console.info(`[copilot] Running on ${copilotModel()}.`);\n    return copilotModel();\n  }\n  console.info(`[copilot] Running on the scripted mock model (${reason}).`);\n  return createMockModel();\n}"},{"title":"Tests for the gate (draft, mock-default-prod)","file":"src/lib/server-data.test.ts","code":"// src/lib/server-data.test.ts: pins the real-model gate.\nimport { describe, expect, it } from \"vitest\";\nimport { copilotModel } from \"./server-data\";\n\ndescribe(\"copilotModel: the real model only where it is allowed\", () => {\n  it(\"runs the mock with no key\", () => {\n    expect(copilotModel({ NODE_ENV: \"production\", ALLOW_REAL_MODEL: \"true\" })).toBe(\"mock\");\n  });\n  it(\"runs the mock with COPILOT_MODEL=mock, even with a key\", () => {\n    expect(copilotModel({ OPENAI_API_KEY: \"test\", COPILOT_MODEL: \"mock\" })).toBe(\"mock\");\n  });\n  it(\"uses the default model in development with a key\", () => {\n    expect(copilotModel({ OPENAI_API_KEY: \"test\", NODE_ENV: \"development\" })).toBe(\"openai/gpt-5.4-mini\");\n  });\n  it(\"ignores the key in a production build without ALLOW_REAL_MODEL=true\", () => {\n    expect(copilotModel({ OPENAI_API_KEY: \"test\", NODE_ENV: \"production\" })).toBe(\"mock\");\n  });\n  it(\"uses the configured model in production with ALLOW_REAL_MODEL=true\", () => {\n    expect(\n      copilotModel({ OPENAI_API_KEY: \"test\", NODE_ENV: \"production\", ALLOW_REAL_MODEL: \"true\", COPILOT_MODEL: \"openai/gpt-5.4-mini\" }),\n    ).toBe(\"openai/gpt-5.4-mini\");\n  });\n});"},{"title":"New names for .env.example","file":".env.example","code":"# Add to .env.example (names only; values go in .env.local and on Render).\n\n# Okta sign-in (Auth.js). Locally: a dev Okta app integration with\n# http://localhost:3100/api/auth/callback/okta as a sign-in redirect URI.\nAUTH_SECRET=\nAUTH_OKTA_ID=\nAUTH_OKTA_SECRET=\nAUTH_OKTA_ISSUER=\n# Production builds run the scripted mock unless this is true. Set it only where Okta sign-in is in front.\n# ALLOW_REAL_MODEL=true\n# CopilotKit Intelligence (threads, analytics, Automatic Learning). Both settings, or it stays off.\n# CPK_INTELLIGENCE_ENABLED=true\n# CPK_INTELLIGENCE_API_KEY=\n# CPK_INTELLIGENCE_LEARNING_CONTAINER_ID=headcount-approvals"},{"title":"package.json additions","file":"package.json","code":"// package.json: pin Node and add a start script that a host can reach (npm start stays on 127.0.0.1).\n\"engines\": { \"node\": \">=22.12\" },\n\"scripts\": {\n  \"start:public\": \"next start -H 0.0.0.0\"\n}\n// Then, with your yes on auth-gate: npm install next-auth@beta"}],"notVerified":["What running it for real means: as built, everyone is Dana Kim, one person clicks every approval, and records stay in each browser (`shared-state`). Behind Okta it is safe to run, but it can't route a real approval yet.","The code snippets (Auth.js, `proxy.ts`, the gated route, the health route, the model gate and its tests) are drafts: not compiled or run, and `next-auth` isn't installed. Auth.js on Next.js 16's `proxy.ts` needs checking when you install it.","CopilotKit Intelligence for threads: not wired; the port of Open Harvey's `intelligence.ts` and the per-environment projects are still to do.","`render.yaml` was parsed locally but not validated by Render; the Blueprint page validates it (`autoDeployTrigger` and `generateValue` are the fields to watch).","The production build (`npm run build`) and a local `next start` on a non-default port: not run in this session.","Streaming through Render's proxy, the real model behind Okta, the 429 message in the chat, and per-user thread scoping: all wait for staging.","The rollback: not tried yet.","`npm audit`: README reports 33 known vulnerabilities through the runtime's dependencies; not re-checked.","HR data handling: real comp bands in the client bundle and in OpenAI prompts need HR and security sign-off (`hr-data`)."],"next":"Next: `/secure-governance`, before HR ops relies on it: who may request and approve (Okta groups to roles), where requests and decisions are stored and audited, and which HR data may reach the browser and OpenAI.","headline":"Not ready for HR ops yet: put Okta in front of the agent and move approvals to the server first.","blockers":["spec-scope","shared-state","auth-gate","real-model-gate","hr-data"]}</script>
<style>
:root {
  --paper: #f6f5f1; --surface: #ffffff; --stone: #edebe6; --ink: #141310; --ink-soft: #2d2b27;
  --muted: #65615a; --hairline: #e2dfd8; --rule: #cbc7be; --on-ink: #ffffff;
  --serif: "Iowan Old Style", "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121110; --surface: #1b1a18; --stone: #252421; --ink: #f0eee9; --ink-soft: #d8d5ce;
    --muted: #a9a59c; --hairline: #2f2d29; --rule: #45423c; --on-ink: #121110; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121110; --surface: #1b1a18; --stone: #252421; --ink: #f0eee9; --ink-soft: #d8d5ce;
  --muted: #a9a59c; --hairline: #2f2d29; --rule: #45423c; --on-ink: #121110; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 16px 64px; }
a { color: inherit; text-underline-offset: 2px; }
code, pre, kbd { font-family: var(--mono); font-size: 0.86em; }
code { background: var(--stone); border-radius: 4px; padding: 0.08em 0.32em; overflow-wrap: anywhere; }
pre code { background: none; padding: 0; border-radius: 0; overflow-wrap: normal; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 42px); line-height: 1.1; }
h2 { font-size: 23px; line-height: 1.25; }
h3 { font-size: 17px; line-height: 1.3; font-family: var(--sans); font-weight: 600; letter-spacing: 0; }
button { font: inherit; color: inherit; }
.eyebrow { font: 600 12px/1.4 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* Header */
header.top { border-bottom: 1px solid var(--rule); padding-bottom: 20px; margin-bottom: 24px; }
header.top .eyebrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: baseline; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 16px; font-size: 13px; }
.meta div { display: flex; gap: 6px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-weight: 600; }
.crumb { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.crumb .root { font: 600 12px/1.4 var(--mono); letter-spacing: 0.02em; }
.crumb strong { color: var(--ink); }
.flow .step b { font-weight: 700; margin-right: 6px; }
.flow li.learn span { border-style: dashed; }
header.top h1 { margin: 18px 0 8px; font-size: clamp(26px, 5.2vw, 38px); line-height: 1.15; }
header.top p.meta { margin: 0; font-size: 13px; color: var(--muted); }
.blockers { border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); padding: 14px 16px; margin: 0 0 22px; }
.blockers h2 { font-size: 19px; margin: 0 0 8px; }
.blockers ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.blockers li { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 8px; }
.blockers a { font-weight: 600; text-decoration-thickness: 1px; }
.slabel.inline { display: inline; margin: 0; white-space: nowrap; }
.disclaimer { font-style: italic; }
@media (max-width: 600px) { .blockers li { grid-template-columns: auto minmax(0, 1fr); } .blockers li .slabel.inline { display: none; } }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 500 13px/1 var(--mono); }
